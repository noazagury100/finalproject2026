<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרופיל אישי - Instagram </title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore">אקספלור</a></li>
                    <li><a href="/groups">קבוצות</a></li>
                    <li><a href="/profile" class="active">פרופיל</a></li>
                    <li><a href="/stats">סטטיסטיקות</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-layout" style="flex-direction: column;">
        <section class="create-post-card" style="margin-bottom: 24px;">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="userAvatar" class="avatar-circle" style="width: 60px; height: 60px; font-size: 24px; display: flex; align-items: center; justify-content: center; background: #0095f6; color: white; border-radius: 50%;">?</div>
                    <div>
                        <h2 id="profileUsername" style="margin: 0; font-size: 22px; color: #262626;">טוען...</h2>
                        <p style="margin: 4px 0 0 0; color: #8e8e8e; font-size: 14px;">משתמש רשום ברשת החברתית</p>
                    </div>
                </div>
                
                <button onclick="window.location.href='/api/auth/logout'" style="background: #ed4956; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;">
                    🚪 התנתק מהחשבון
                </button>
            </div>
        </section>

        <section class="create-post-card">
            <h3>📊 נתוני מעורבות שבועית </h3>
            <svg id="likesChart" style="width: 100%; max-width: 500px; height: 200px; margin-top: 15px;"></svg>
        </section>
    </main>

    <footer class="main-footer">
        <p>Instagram &copy; 2026</p>
    </footer>

    <script src="/js/profile.js"></script>
</body>
</html>
