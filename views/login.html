<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram  - התחברות והרשמה</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #fafafa;">

    <div class="create-post-card" style="width: 100%; max-width: 350px; padding: 30px; text-align: center; border: 1px solid #dbdbdb; background: white; border-radius: 8px;">
        <h1 class="logo" style="margin-bottom: 25px; font-size: 32px;">Instagram</h1>

        <div style="display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid #dbdbdb; padding-bottom: 10px;">
            <button id="tabLogin" type="button" style="background: none; border: none; font-weight: bold; color: #0095f6; cursor: pointer; font-size: 15px;">התחברות</button>
            <button id="tabRegister" type="button" style="background: none; border: none; font-weight: bold; color: #8e8e8e; cursor: pointer; font-size: 15px;">הרשמה</button>
        </div>

        <form id="authForm">
            <div class="form-group">
                <input type="text" id="authUsername" placeholder="שם משתמש" required style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #dbdbdb; border-radius: 4px; font-size: 14px;">
            </div>
            <div class="form-group">
                <input type="password" id="authPassword" placeholder="סיסמה" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #dbdbdb; border-radius: 4px; font-size: 14px;">
            </div>
            <button type="submit" id="authSubmitBtn" class="submit-btn" style="width: 100%; padding: 10px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">התחבר</button>
        </form>

        <p id="authMessage" style="margin-top: 15px; font-size: 13px; display: none;"></p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
