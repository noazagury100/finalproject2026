<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - סטטיסטיקות</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore">אקספלור</a></li>
                    <li><a href="/groups">קבוצות</a></li>
                    <li><a href="/profile">פרופיל</a></li>
                    <li><a href="/stats" class="active">סטטיסטיקות</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-layout" style="flex-direction: column; align-items: center;">
        <!-- רכיב הגרף -->
        <div class="create-post-card" style="width: 100%; max-width: 600px; text-align: center; margin-top: 20px;">
            <h3>📊 התפלגות פוסטים לפי סוג מדיה</h3>
            <div id="media-type-chart" style="display: flex; justify-content: center; margin-top: 20px;"></div>
        </div>

        <!-- טופס חיפוש מתקדם (עונה על דרישת 3 פרמטרים במקביל) -->
        <div class="create-post-card" style="width: 100%; max-width: 600px; text-align: right; margin-top: 20px; margin-bottom: 20px;">
            <h3 style="margin-bottom: 12px; text-align: center;">🔍 חיפוש פוסטים מתקדם</h3>
            <form id="advancedSearchForm" style="display: flex; flex-direction: column; gap: 10px;">
                <div>
                    <label style="font-size: 13px; color: #666;">טקסט חופשי:</label>
                    <input type="text" id="searchKeyword" placeholder="חפש לפי מילה בפוסט..." style="width: 100%; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                </div>
                <div>
                    <label style="font-size: 13px; color: #666;">סוג מדיה:</label>
                    <select id="searchMediaType" style="width: 100%; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px; background: white;">
                        <option value="">הכל</option>
                        <option value="text">טקסט בלבד</option>
                        <option value="image">תמונה</option>
                        <option value="video">וידאו</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 13px; color: #666;">מתאריך:</label>
                    <input type="date" id="searchFromDate" style="width: 100%; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                </div>
                <button type="submit" class="submit-btn" style="width: 100%; margin-top: 5px; padding: 10px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">חפש פוסטים</button>
            </form>
            
            <!-- תוצאות החיפוש -->
            <div id="searchResultsContainer" style="margin-top: 15px; border-top: 1px solid #efefef; padding-top: 10px;"></div>
        </div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project</p>
    </footer>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/js/stats.js"></script>
</body>
</html>
