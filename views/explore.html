<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אקספלור - Instagram Clone</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore" class="active">אקספלור</a></li>
                    <li><a href="/groups">קבוצות</a></li>
                    <li><a href="/profile">פרופיל</a></li>
                    <li><a href="/stats">סטטיסטיקות</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-layout" style="flex-direction: column;">
        <!-- טופס חיפוש מורכב עם 3 פרמטרים (סעיף 23) -->
        <section class="create-post-card" style="margin-bottom: 30px;">
            <h3>🔍 חיפוש פוסטים מתקדם</h3>
            <form id="searchForm" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <input type="text" id="searchText" placeholder="חפש לפי טקסט..." style="flex: 1; min-width: 150px; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                
                <select id="searchMediaType" style="flex: 1; min-width: 120px; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                    <option value="">כל סוגי המדיה</option>
                    <option value="text">טקסט בלבד</option>
                    <option value="image">תמונה</option>
                    <option value="video">וידאו</option>
                </select>
                
                <input type="date" id="searchFromDate" style="flex: 1; min-width: 130px; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                
                <button type="submit" class="submit-btn" style="width: auto; padding: 8px 20px;">חפש</button>
            </form>
        </section>

        <!-- אזור הצגת תוצאות החיפוש -->
        <section>
            <h2>תוצאות חיפוש / גלריה</h2>
            <div id="searchResults" class="explore-gallery" style="margin-top: 20px;"></div>
        </section>
    </main>

    <footer class="main-footer">
        <p>Instagram Clone &copy; 2026</p>
    </footer>

    <script>
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const text = document.getElementById('searchText').value.trim();
        const mediaType = document.getElementById('searchMediaType').value;
        const fromDate = document.getElementById('searchFromDate').value;
        
        const queryParams = new URLSearchParams();
        if (text) queryParams.append('text', text);
        if (mediaType) queryParams.append('mediaType', mediaType);
        if (fromDate) queryParams.append('fromDate', fromDate);
        
        try {
            const response = await fetch(`/api/stats/search-posts?${queryParams.toString()}`);
            const posts = await response.json();
            
            const resultsContainer = document.getElementById('searchResults');
            if (posts.length === 0) {
                resultsContainer.innerHTML = '<p style="text-align: center; color: #8e8e8e; width: 100%;">לא נמצאו פוסטים תואמים לחיפוש.</p>';
                return;
            }
            
            resultsContainer.innerHTML = posts.map(post => `
                <div class="post-card" style="padding: 12px; margin-bottom: 15px;">
                    <strong>${post.author ? post.author.username : 'משתמש'}:</strong>
                    <p style="margin: 5px 0;">${post.text || ''}</p>
                    ${post.mediaUrl && post.mediaType === 'image' ? `<img src="${post.mediaUrl}" style="max-width: 100%; border-radius: 4px; margin-top: 5px;">` : ''}
                </div>
            `).join('');
        } catch (error) {
            console.error('Search error:', error);
        }
    });
    </script>
</body>
</html>
