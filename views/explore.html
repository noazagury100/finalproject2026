<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Explore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore" class="active">אקספלור</a></li>
                    <li><a href="/groups">קבוצות</a></li>
                    <li><a href="/profile">פרופיל</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-layout" style="justify-content: center;">
        
        <section class="explore-section" style="width: 100%; max-width: 900px;">
            <h2 style="margin-bottom: 15px;">גלריית אקספלור 📸</h2>
            
            <div class="video-container" style="margin-bottom: 25px;">
                <h3 style="margin-bottom: 10px; color: #8e8e8e;">סרטון מומלץ היום 🎥</h3>
                <video controls width="100%" style="border-radius: 8px;">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    הדפדפן שלך לא תומך בווידאו.
                </video>
            </div>

            <div class="explore-gallery" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600" alt="תמונה 1" style="width:100%; border-radius: 8px; object-fit: cover; height: 200px;">
                <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=600" alt="תמונה 2" style="width:100%; border-radius: 8px; object-fit: cover; height: 200px;">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600" alt="תמונה 3" style="width:100%; border-radius: 8px; object-fit: cover; height: 200px;">
                <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600" alt="תמונה 4" style="width:100%; border-radius: 8px; object-fit: cover; height: 200px;">
                <img src="https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=600" alt="תמונה 5" style="width:100%; border-radius: 8px; object-fit: cover; height: 200px;">
                <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=600" alt="תמונה 6" style="width:100%; border-radius: 8px; object-fit: cover; height: 200px;">
            </div>
        </section>

    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project - Explore Page</p>
    </footer>

</body>
</html>
