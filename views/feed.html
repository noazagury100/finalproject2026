<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header סמנטי לפי דרישה 31 -->
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <!-- Nav סמנטי לפי דרישה 31 -->
            <nav class="main-nav">
                <ul>
                    <li><a href="#" class="active">פיד</a></li>
                    <li><a href="#">קבוצות</a></li>
                    <li><a href="#">פרופיל</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-layout">
        
        <!-- Section סמנטי לפי דרישה 31 -->
        <section class="feed-section">
            
            <!-- טופס יצירת פוסט (דרישה 21 & 22) -->
            <div class="create-post-card">
                <h3>שתף פוסט חדש</h3>
                <form id="createPostForm">
                    <div class="form-group">
                        <select id="postTypeInput" required>
                            <option value="text">✍️ טקסט בלבד</option>
                            <option value="image">📸 תמונה</option>
                            <option value="video">🎥 סרטון</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="postCaptionInput" placeholder="מה תרצי לשתף?" required>
                    </div>
                    <div class="form-group" id="urlInputContainer">
                        <input type="url" id="postUrlInput" placeholder="הדבק קישור למדיה (תמונה/וידאו)">
                    </div>
                    <button type="submit" class="submit-btn">פרסם פוסט</button>
                </form>
            </div>

            <!-- מכל הפוסטים הדינמיים (AJAX - דרישה 30) -->
            <div id="feedContainer">
                <!-- הפוסטים יישתלו כאן ב-JS -->
            </div>
        </section>

        <!-- Aside סמנטי לפי דרישה 31 -->
        <aside class="sidebar-section">
            <div class="sidebar-card">
                <h3>קבוצות מומלצות</h3>
                <ul class="groups-list">
                    <!-- ייטען ב-AJAX מ-groupsRoutes -->
                </ul>
            </div>
        </aside>

    </div>

    <!-- Footer סמנטי לפי דרישה 31 -->
    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project - פרויקט גמר</p>
    </footer>

    <script src="/js/feed.js"></script>
</body>
</html>
