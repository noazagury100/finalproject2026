<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- סרגל עליון -->
    <header class="main-header">
        <h1 class="logo">Instagram</h1>
        <nav class="main-nav">
            <ul>
                <li><a href="#">פיד</a></li>
                <li><a href="#">אקספלור</a></li>
                <li><a href="#">פרופיל</a></li>
            </ul>
        </nav>
    </header>

    <!-- תוכן מרכזי -->
    <main class="main-container">
        
        <!-- אזור הפוסטים -->
        <section class="feed-section">
            
            <!-- דוגמה לפוסט וידאו -->
            <article class="post">
                <header class="post-header">
                    <img src="https://via.placeholder.com/40" alt="תמונת פרופיל" class="avatar">
                    <span class="username">user_demo</span>
                </header>
                
                <div class="post-media">
                    <video controls width="100%">
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        הבדפדפן שלך לא תומך בוידאו.
                    </video>
                </div>

                <div class="post-actions">
                    <button class="btn-like">❤️ לייק</button>
                    <button class="btn-comment">💬 תגובה</button>
                </div>

                <div class="post-caption">
                    <p><strong>user_demo</strong> פוסט ראשון ברשת החברתית שלנו!</p>
                </div>
            </article>

        </section>

        <!-- סרגל צדדי (קבוצות מומלצות / מידע) -->
        <aside class="sidebar">
            <h3>קבוצות מומלצות</h3>
            <ul>
                <li>קבוצת תכנות</li>
                <li>קבוצת מוזיקה</li>
            </ul>
        </aside>

    </main>

    <!-- פוטר -->
    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project - נועה, איתי ותומר</p>
    </footer>

</body>
</html>
