<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- טעינת ספריית D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
          
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore">אקספלור</a></li>
                    <li><a href="/groups">קבוצות</a></li>
                    <li><a href="/profile" class="active">פרופיל</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-layout">
        <section class="feed-section">
            <div class="post-card" style="padding: 24px; text-align: center;">
                <div class="avatar-circle" style="width: 80px; height: 80px; margin: 0 auto 15px; font-size: 32px;">א</div>
                <h2>אבי כהן</h2>
                <p style="color: #8e8e8e; margin-top: 5px;">@avi_cohen</p>
            </div>

            <!-- קונטיינר לגרף D3.js -->
            <div class="post-card" style="padding: 20px; margin-top: 20px;">
                <h3 style="margin-bottom: 15px; text-align: center;">סטטיסטיקת לייקים שבועית 📊</h3>
                <div id="d3-chart" style="display: flex; justify-content: center;"></div>
            </div>
        </section>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project - Profile Page</p>
    </footer>

    <!-- חיבור סקריפט הפרופיל -->
    <script src="/js/profile.js"></script>
</body>
</html>
