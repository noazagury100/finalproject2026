<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצות - Instagram Clone</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore">אקספלור</a></li>
                    <li><a href="/groups" class="active">קבוצות</a></li>
                    <li><a href="/profile">פרופיל</a></li>
                    <li><a href="/stats">סטטיסטיקות</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-layout" style="flex-direction: column;">
        
        <!-- טופס יצירת קבוצה חדשה (סעיף 26) -->
        <section class="create-post-card" style="margin-bottom: 24px;">
            <h3>➕ יצירת קבוצה חדשה</h3>
            <form id="createGroupForm" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <input type="text" id="groupNameInput" placeholder="שם הקבוצה..." required style="flex: 1; min-width: 180px; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                <input type="text" id="groupDescInput" placeholder="תיאור הקבוצה..." style="flex: 2; min-width: 220px; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px;">
                <button type="submit" class="submit-btn" style="width: auto; padding: 8px 20px;">צור קבוצה</button>
            </form>
        </section>

        <!-- רשימת הקבוצות הקימות והניהול שלהן -->
        <section class="create-post-card" style="margin-bottom: 24px;">
            <h3>👥 קבוצות ברשת והצטרפות</h3>
            <div id="groupsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px;"></div>
        </section>

        <!-- מפת מיקומי קבוצות (Leaflet) -->
        <section class="create-post-card">
            <h3>🗺️ מפת מפגשי קבוצות פריסה ארצית</h3>
            <div id="map" style="height: 350px; border-radius: 6px; margin-top: 10px;"></div>
        </section>

    </main>

    <footer class="main-footer">
        <p>Instagram Clone &copy; 2026</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/groups.js"></script>
</body>
</html>
