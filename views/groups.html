<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Groups</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="/explore">אקספלור</a></li>
                    <li><a href="/groups" class="active">קבוצות</a></li>
                    <li><a href="/profile">פרופיל</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-layout">
        <section class="feed-section">
            <h2 style="margin-bottom: 15px;">קבוצות ברשת</h2>
            <div class="sidebar-card" style="padding: 20px; border: 1px solid #dbdbdb; border-radius: 8px; background: white;">
                <h3>קבוצת אוהבי כלבים 🐶</h3>
                <p style="font-size: 14px; margin-bottom: 15px; color: #8e8e8e;">מנהל: noa_z</p>
                <button id="joinGroupBtn" type="button" style="width: 100%; padding: 10px; background-color: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">הצטרף לקבוצה</button>
            </div>
        </section>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project - Groups Page</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('joinGroupBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    if (this.innerText.includes('הצטרף לקבוצה')) {
                        this.innerText = 'הצטרפת לקבוצה! ✅';
                        this.style.backgroundColor = '#262626';
                        alert('הצטרפת בהצלחה לקבוצה!');
                    } else {
                        this.innerText = 'הצטרף לקבוצה';
                        this.style.backgroundColor = '#0095f6';
                    }
                });
            }
        });
    </script>
</body>
</html>
