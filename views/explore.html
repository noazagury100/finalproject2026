    <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Explore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- תגית header סמנטית (דרישה 31) -->
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Instagram</h1>
            <!-- תגית nav סמנטית (דרישה 31) -->
            <nav class="main-nav">
                <ul>
                    <li><a href="/">פיד</a></li>
                    <li><a href="#" class="active">אקספלור</a></li>
                    <li><a href="#">קבוצות</a></li>
                    <li><a href="#">פרופיל</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-layout">
        
        <!-- תגית section סמנטית (דרישה 31) -->
        <section class="explore-section">
            <h2 style="margin-bottom: 15px;">גלריית אקספלור</h2>
            
            <!-- תגית video של HTML5 (דרישה 31) -->
            <div class="video-container" style="margin-bottom: 25px;">
                <h3 style="margin-bottom: 10px; color: #8e8e8e;">סרטון מומלץ היום 🎥</h3>
                <video controls width="100%" style="border-radius: 8px;">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    הדפדפן שלך לא תומך בווידאו.
                </video>
            </div>

            <!-- גלריית תמונות שתעוצב ב-CSS בשיטת multiple-columns -->
            <div class="explore-gallery">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500" alt="תמונה 1" style="width:100%; margin-bottom: 10px; border-radius: 8px;">
                <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=500" alt="תמונה 2" style="width:100%; margin-bottom: 10px; border-radius: 8px;">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=500" alt="תמונה 3" style="width:100%; margin-bottom: 10px; border-radius: 8px;">
                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=500" alt="תמונה 4" style="width:100%; margin-bottom: 10px; border-radius: 8px;">
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500" alt="תמונה 5" style="width:100%; margin-bottom: 10px; border-radius: 8px;">
                <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500" alt="תמונה 6" style="width:100%; margin-bottom: 10px; border-radius: 8px;">
            </div>
        </section>

        <!-- תגית aside סמנטית (דרישה 31) -->
        <aside class="sidebar-section">
            <div class="sidebar-card">
                <h3>טרנדים חמים</h3>
                <p style="font-size: 14px; color: #0095f6;">#תכנות #NodeJS #InstagramClone</p>
            </div>
        </aside>

    </div>

    <!-- תגית footer סמנטית (דרישה 31) -->
    <footer class="main-footer">
        <p>&copy; 2026 Instagram Project - Explore Page</p>
    </footer>

</body>
</html>
